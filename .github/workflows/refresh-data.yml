name: Refresh card data

# Rebuilds data/cards.json from the YGOPRODeck API so new reprints of
# covered monsters show up without a code change.
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/refresh-data.yml"
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build data/cards.json
        run: node scripts/build-data.mjs
      - name: Commit if the data changed
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "Card data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh card data from YGOPRODeck" -m "Automated weekly rebuild of data/cards.json by the Refresh card data workflow."
          git pull --rebase
          git push
